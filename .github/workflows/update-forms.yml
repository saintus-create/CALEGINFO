name: Update California court forms corpus

# Refreshes public/corpus/forms/FORMS.jsonl.gz from the Judicial Council's
# self-help portal (https://selfhelp.courts.ca.gov/json/jcc-forms) and commits
# the result back to the branch. The dev sandbox has no egress to
# courts.ca.gov, so the fetch runs here; the app itself only reads the
# committed gz, exactly like the bills / rules / directory corpora.

on:
  workflow_dispatch:
  schedule:
    # Mondays 09:00 UTC on the default branch. The Judicial Council revises
    # forms on a quarterly cycle (Jan 1 / Apr 1 / Jul 1 / Oct 1), so a weekly
    # sweep picks a revision up within days of it posting instead of waiting
    # for someone to notice. Without this the corpus is a frozen snapshot:
    # nothing else in the repo re-runs the fetch.
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
      - arena/01a10a94-caleginfo
      - arena/61a3973a-caleginfo
    paths:
      - "scripts/fetch_forms.py"
      - "scripts/check_forms.py"
      - "scripts/sync_forms_count.py"
      - ".github/workflows/update-forms.yml"

permissions:
  contents: write

concurrency:
  group: update-forms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and pack the forms corpus
        run: python3 scripts/fetch_forms.py

      # A truncated upstream export (paginated or interrupted) still packs and
      # hashes cleanly, and fetch_forms.py would happily write the smaller gz
      # and rewrite the manifest to match — so nothing downstream would notice
      # the records were lost. check_forms.py is the gate: it enforces a floor
      # on the record count, re-checks the manifest sha/records/series, and
      # confirms the sentinel forms are still present. If it fails, the job
      # stops here and the committed corpus is left untouched.
      - name: Sync the advertised catalog size
        run: python3 scripts/sync_forms_count.py

      - name: Verify the packed corpus
        run: python3 scripts/check_forms.py

      - name: Commit if the corpus changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/corpus/forms/FORMS.jsonl.gz public/corpus/manifest.json \
                  agent/tools/search_forms.ts lib/engine.js
          if git diff --cached --quiet; then
            echo "Forms corpus already current — nothing to commit."
            exit 0
          fi
          count=$(gzip -dc public/corpus/forms/FORMS.jsonl.gz | wc -l)
          git commit -m "corpus(forms): refresh Judicial Council forms (${count} forms)"
          git push origin "HEAD:${{ github.ref_name }}"
